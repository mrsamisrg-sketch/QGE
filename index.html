<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qaiser Group Of Electronics - Rates Portal</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Reading Excel File -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome for Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <!-- Theme Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        qgRed: '#dc2626',   /* Deep Red */
                        qgBlack: '#111827', /* Rich Black */
                        qgWhite: '#ffffff', /* White */
                        qgGray: '#f3f4f6'   /* Light Gray Background */
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hide { display: none !important; }
        .active-view-btn { background-color: #dc2626; color: white; border-color: #dc2626; }
        
        /* Custom Dropdown Styles */
        .custom-option:hover { background-color: #fee2e2; color: #dc2626; }
    </style>
</head>
<body class="bg-qgGray text-qgBlack min-h-screen flex flex-col">

    <!-- Compact Header -->
    <header id="main-header" class="bg-qgBlack text-qgWhite shadow-lg border-b-2 border-qgRed fixed w-full top-0 z-[60] transition-transform duration-300 ease-in-out">
        <div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bolt text-qgRed text-xl"></i>
                <div class="text-left">
                    <h1 class="text-lg md:text-xl font-bold tracking-wider uppercase">Qaiser Group <span class="text-qgRed">Of Electronics</span></h1>
                    <p class="text-[10px] text-gray-400">Salesman Rates Portal <span id="demo-badge" class="ml-2 bg-yellow-500 text-black px-1.5 py-0.5 rounded text-[8px] font-bold">DEMO MODE</span></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-2 md:px-4 pt-16 pb-6 w-full">
        
        <!-- Controls & Filters Section -->
        <section class="bg-qgWhite p-3 rounded-md shadow border-t-2 border-qgBlack mb-4 flex flex-col gap-3">
            
            <!-- TOP ROW: Search Bar -->
            <div class="relative w-full">
                <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Search Model, Company or Product..." 
                       class="w-full pl-9 pr-3 py-1.5 text-sm border border-gray-300 rounded focus:outline-none focus:border-qgRed transition-colors">
            </div>

            <!-- BOTTOM ROW: Dropdowns and View Buttons in One Line -->
            <div class="flex flex-row justify-between items-center gap-2">
                
                <!-- Filters Left Side -->
                <div class="flex flex-row gap-2 w-full sm:w-auto">
                    <!-- Custom Company Dropdown -->
                    <div class="relative w-1/2 sm:w-36 custom-dropdown-container">
                        <button id="company-btn" class="w-full bg-white border border-gray-300 text-left px-2 py-1.5 text-xs rounded shadow-sm flex justify-between items-center focus:outline-none focus:border-qgRed">
                            <span id="company-selected" class="truncate pr-2">All Companies</span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-gray-500"></i>
                        </button>
                        <!-- Dropdown List -->
                        <ul id="company-list" class="hide absolute z-50 w-full bg-white border border-gray-200 mt-1 rounded shadow-lg max-h-48 overflow-y-auto text-xs font-medium">
                            <li class="custom-option px-3 py-2 cursor-pointer border-b border-gray-100" data-value="All">All Companies</li>
                            <!-- Options injected via JS -->
                        </ul>
                    </div>

                    <!-- Custom Product Dropdown -->
                    <div class="relative w-1/2 sm:w-36 custom-dropdown-container">
                        <button id="product-btn" class="w-full bg-white border border-gray-300 text-left px-2 py-1.5 text-xs rounded shadow-sm flex justify-between items-center focus:outline-none focus:border-qgRed">
                            <span id="product-selected" class="truncate pr-2">All Products</span>
                            <i class="fa-solid fa-chevron-down text-[10px] text-gray-500"></i>
                        </button>
                        <!-- Dropdown List -->
                        <ul id="product-list" class="hide absolute z-50 w-full bg-white border border-gray-200 mt-1 rounded shadow-lg max-h-48 overflow-y-auto text-xs font-medium">
                            <li class="custom-option px-3 py-2 cursor-pointer border-b border-gray-100" data-value="All">All Products</li>
                            <!-- Options injected via JS -->
                        </ul>
                    </div>
                </div>

                <!-- Buttons Right Side -->
                <div class="flex gap-1 flex-shrink-0">
                    <button id="btn-grid" class="active-view-btn px-2 py-1.5 border border-gray-300 rounded text-xs transition-colors shadow-sm" title="Cards View">
                        <i class="fa-solid fa-table-cells-large"></i>
                    </button>
                    <button id="btn-list" class="bg-white text-gray-700 hover:bg-gray-100 px-2 py-1.5 border border-gray-300 rounded text-xs transition-colors shadow-sm" title="List View">
                        <i class="fa-solid fa-list"></i>
                    </button>
                </div>

            </div>
        </section>

        <!-- Loading State for Excel -->
        <div id="loading" class="hide text-center py-4 mb-2">
            <i class="fa-solid fa-spinner fa-spin text-xl text-qgRed"></i>
            <span class="text-xs text-gray-500 ml-2">Syncing live rates...</span>
        </div>

        <!-- Data Container -->
        <div id="data-container">
            <!-- Cards View -->
            <div id="cards-view" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Cards will be injected here via JS -->
            </div>

            <!-- List View -->
            <div id="list-view" class="hide overflow-x-auto bg-qgWhite rounded-lg shadow-md border-t-2 border-qgBlack">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-qgBlack text-qgWhite">
                        <tr>
                            <th class="p-2 border-b border-gray-700 whitespace-nowrap text-xs">Company</th>
                            <th class="p-2 border-b border-gray-700 whitespace-nowrap text-xs">Product</th>
                            <th class="p-2 border-b border-gray-700 whitespace-nowrap text-xs">Model</th>
                            <th class="p-2 border-b border-gray-700 text-green-400 whitespace-nowrap text-xs">Cash Rate</th>
                            <th class="p-2 border-b border-gray-700 text-qgRed whitespace-nowrap text-xs">Installment Rate</th>
                            <th class="p-2 border-b border-gray-700 whitespace-nowrap text-xs">Period</th>
                        </tr>
                    </thead>
                    <tbody id="list-body">
                        <!-- Rows will be injected here via JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- No Results Found -->
            <div id="no-results" class="hide text-center py-10">
                <i class="fa-solid fa-box-open text-3xl text-gray-400 mb-2"></i>
                <h2 class="text-base font-semibold text-gray-600">No products found</h2>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-qgBlack text-qgWhite text-center py-2 border-t-2 border-qgRed mt-auto">
        <p class="text-[10px]">&copy; <span id="current-year"></span> Qaiser Group Of Electronics.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        document.getElementById('current-year').innerText = new Date().getFullYear();

        const FILE_NAME = 'rates.xlsx'; 
        let currentView = 'cards';
        
        // Custom Filter Variables
        let selectedCompanyVal = 'All';
        let selectedProductVal = 'All';

        // DEMO DATA
        let demoData = [
            { "Company": "Haier", "Product": "Inverter AC", "Model": "18HFMAC 1.5 Ton", "Cash Rate": 155000, "Installment Rate": 185000, "Month": "Sep", "Year": "2026" },
            { "Company": "Dawlance", "Product": "Refrigerator", "Model": "91999 Avante +", "Cash Rate": 115000, "Installment Rate": 138000, "Month": "Sep", "Year": "2026" },
            { "Company": "TCL", "Product": "LED Smart TV", "Model": "50P635 4K", "Cash Rate": 105000, "Installment Rate": 120000, "Month": "Sep", "Year": "2026" }
        ];
        
        let allData = [...demoData]; 

        // Elements
        const searchInput = document.getElementById('search-input');
        const btnGrid = document.getElementById('btn-grid');
        const btnList = document.getElementById('btn-list');
        const cardsView = document.getElementById('cards-view');
        const listView = document.getElementById('list-view');
        const listBody = document.getElementById('list-body');
        const dataContainer = document.getElementById('data-container');
        const noResultsDiv = document.getElementById('no-results');
        const header = document.getElementById('main-header');
        const demoBadge = document.getElementById('demo-badge');
        const loadingDiv = document.getElementById('loading');

        // Custom Dropdown Elements
        const companyBtn = document.getElementById('company-btn');
        const companyList = document.getElementById('company-list');
        const companySelected = document.getElementById('company-selected');
        
        const productBtn = document.getElementById('product-btn');
        const productList = document.getElementById('product-list');
        const productSelected = document.getElementById('product-selected');

        // Hide Header on Scroll Down
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                header.classList.add('-translate-y-full');
            } else {
                header.classList.remove('-translate-y-full');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; 
        });

        // Initialize App
        async function init() {
            populateFilters(allData);
            renderData(allData);
            
            loadingDiv.classList.remove('hide');
            try {
                const response = await fetch(FILE_NAME + "?v=" + new Date().getTime()); 
                if (!response.ok) throw new Error("File not found");
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                
                let rawData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                // Format keys and trim values properly
                let excelData = rawData.map(row => {
                    let formattedRow = {};
                    for (let key in row) {
                        let val = row[key];
                        // Clean up extra spaces from excel
                        if(typeof val === 'string') val = val.trim();
                        formattedRow[key.trim()] = val;
                    }
                    return formattedRow;
                });

                if(excelData.length > 0) {
                    allData = excelData; 
                    demoBadge.classList.add('hide'); 
                    
                    selectedCompanyVal = 'All';
                    selectedProductVal = 'All';
                    companySelected.innerText = 'All Companies';
                    productSelected.innerText = 'All Products';
                    searchInput.value = '';
                    
                    populateFilters(allData);
                    renderData(allData);
                }
            } catch (error) {
                console.warn("Excel file not loaded, showing demo data.");
            } finally {
                loadingDiv.classList.add('hide');
            }
        }

        // Dropdown Logic
        function toggleDropdown(listEl) {
            if(listEl !== companyList) companyList.classList.add('hide');
            if(listEl !== productList) productList.classList.add('hide');
            listEl.classList.toggle('hide');
        }

        companyBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(companyList); });
        productBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(productList); });

        document.addEventListener('click', () => {
            companyList.classList.add('hide');
            productList.classList.add('hide');
        });

        // Populate Dropdowns
        function populateFilters(data) {
            const companies = [...new Set(data.map(item => item['Company']))].filter(Boolean).sort();
            const products = [...new Set(data.map(item => item['Product']))].filter(Boolean).sort();

            // Use arrays for faster HTML string building
            let companyHTML = '<li class="custom-option px-3 py-2 cursor-pointer border-b border-gray-100" data-value="All">All Companies</li>';
            let productHTML = '<li class="custom-option px-3 py-2 cursor-pointer border-b border-gray-100" data-value="All">All Products</li>';

            companies.forEach(c => {
                companyHTML += `<li class="custom-option px-3 py-2 cursor-pointer border-b border-gray-100 truncate" data-value="${c}">${c}</li>`;
            });
            products.forEach(p => {
                productHTML += `<li class="custom-option px-3 py-2 cursor-pointer border-b border-gray-100 truncate" data-value="${p}">${p}</li>`;
            });

            companyList.innerHTML = companyHTML;
            productList.innerHTML = productHTML;

            attachDropdownEvents();
        }

        function attachDropdownEvents() {
            document.querySelectorAll('#company-list li').forEach(li => {
                li.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectedCompanyVal = this.getAttribute('data-value');
                    companySelected.innerText = selectedCompanyVal === 'All' ? 'All Companies' : selectedCompanyVal;
                    companyList.classList.add('hide');
                    filterData();
                });
            });

            document.querySelectorAll('#product-list li').forEach(li => {
                li.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectedProductVal = this.getAttribute('data-value');
                    productSelected.innerText = selectedProductVal === 'All' ? 'All Products' : selectedProductVal;
                    productList.classList.add('hide');
                    filterData();
                });
            });
        }

        // Format Currency
        function formatMoney(amount) {
            if(!amount) return "N/A";
            return "Rs. " + Number(amount).toLocaleString('en-PK');
        }

        // Render Data (OPTIMIZED: Uses string concatenation instead of slow DOM append)
        function renderData(data) {
            if (data.length === 0) {
                cardsView.innerHTML = '';
                listBody.innerHTML = '';
                cardsView.classList.add('hide');
                listView.classList.add('hide');
                noResultsDiv.classList.remove('hide');
                return;
            }

            noResultsDiv.classList.add('hide');
            
            if (currentView === 'cards') {
                cardsView.classList.remove('hide');
                listView.classList.add('hide');
            } else {
                listView.classList.remove('hide');
                cardsView.classList.add('hide');
            }

            let cardsHTML = '';
            let listHTML = '';

            data.forEach(item => {
                const company = item['Company'] || 'N/A';
                const product = item['Product'] || 'N/A';
                const model = item['Model'] || 'N/A';
                const cashRate = formatMoney(item['Cash Rate']);
                const installRate = formatMoney(item['Installment Rate']);
                const month = item['Month'] || '';
                const year = item['Year'] || '';
                const period = (month || year) ? `${month} ${year}` : 'N/A';

                // Build Card View (FONT SIZES INCREASED)
                cardsHTML += `
                    <div class="bg-qgWhite p-3 rounded shadow border-t-[3px] border-qgBlack hover:border-qgRed transition-all relative overflow-hidden">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-[9px] font-bold bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded uppercase tracking-wider">${company}</span>
                            <span class="text-[9px] font-bold bg-qgRed text-white px-1.5 py-0.5 rounded"><i class="fa-regular fa-calendar mr-1"></i>${period}</span>
                        </div>
                        <h3 class="text-sm font-bold text-qgBlack mt-2 leading-tight">${model}</h3>
                        <p class="text-[11px] text-gray-500 font-medium mb-2">${product}</p>
                        <div class="border-t border-gray-100 pt-2 flex justify-between items-center bg-gray-50 -mx-3 -mb-3 p-2 rounded-b">
                            <div>
                                <p class="text-[10px] text-gray-500 uppercase font-semibold">Cash</p>
                                <p class="font-bold text-green-600 text-lg md:text-xl">${cashRate}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-gray-500 uppercase font-semibold">Installment</p>
                                <p class="font-bold text-qgRed text-lg md:text-xl">${installRate}</p>
                            </div>
                        </div>
                    </div>
                `;

                // Build Table Row (FONT SIZES INCREASED)
                listHTML += `
                    <tr class="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                        <td class="p-2 font-medium text-gray-800">${company}</td>
                        <td class="p-2 text-gray-600">${product}</td>
                        <td class="p-2 font-bold text-qgBlack">${model}</td>
                        <td class="p-2 font-bold text-green-600 text-base md:text-lg">${cashRate}</td>
                        <td class="p-2 font-bold text-qgRed text-base md:text-lg">${installRate}</td>
                        <td class="p-2 text-[10px] text-gray-500">${period}</td>
                    </tr>
                `;
            });

            cardsView.innerHTML = cardsHTML;
            listBody.innerHTML = listHTML;
        }

        // Filtering Logic (OPTIMIZED: Handles spaces ignored)
        function filterData() {
            // Remove all spaces for smart searching
            const searchTerm = searchInput.value.toLowerCase().replace(/\s+/g, '');

            const filteredData = allData.filter(item => {
                const company = String(item['Company'] || '').toLowerCase().replace(/\s+/g, '');
                const product = String(item['Product'] || '').toLowerCase().replace(/\s+/g, '');
                const model = String(item['Model'] || '').toLowerCase().replace(/\s+/g, '');

                const matchSearch = company.includes(searchTerm) || product.includes(searchTerm) || model.includes(searchTerm);
                
                // Compare accurately
                const matchCompany = selectedCompanyVal === 'All' || item['Company'] === selectedCompanyVal;
                const matchProduct = selectedProductVal === 'All' || item['Product'] === selectedProductVal;

                return matchSearch && matchCompany && matchProduct;
            });

            renderData(filteredData);
        }

        // Debounce Search for Performance
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(filterData, 300); // Wait 300ms before filtering to prevent hanging
        });

        btnGrid.addEventListener('click', () => {
            currentView = 'cards';
            btnGrid.classList.add('active-view-btn');
            btnGrid.classList.remove('bg-white', 'text-gray-700');
            
            btnList.classList.remove('active-view-btn');
            btnList.classList.add('bg-white', 'text-gray-700');
            renderData(allData); // Re-render correct view without re-filtering
            filterData();
        });

        btnList.addEventListener('click', () => {
            currentView = 'list';
            btnList.classList.add('active-view-btn');
            btnList.classList.remove('bg-white', 'text-gray-700');
            
            btnGrid.classList.remove('active-view-btn');
            btnGrid.classList.add('bg-white', 'text-gray-700');
            renderData(allData); // Re-render correct view without re-filtering
            filterData();
        });

        // Run on load
        window.onload = init;
    </script>
</body>
</html>
